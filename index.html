<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pizzaria</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="./img/image.png">
</head>
<body>
  <div class="page">

    <div class="header">
      <img class="logo" src="img/Group 2.png" alt="Tony Pizzaria">
      <div class="nav">
        <div class="nav-item">Home</div>
        <div class="nav-item">Cardápio</div>
        <div class="nav-item">Serviços</div>
        <div class="nav-item">Localização</div>
        <div class="nav-item">Contato</div>
      </div>
    </div>

    <div class="hero">
      <div class="hero-texto">
        <div>Não é apenas</div>
        <div>uma <span class="pizza">Pizza</span>, é</div>
        <div>uma experiência!</div>
      </div>
      <div class="hero-imagem">
        <img class="hero-imagem" src="img/image.png" alt="Pizza">
      </div>
    </div>

    <div class="galeria">
      <div class="item-galeria">
        <img class="img-galeria" src="img/image 2.png" alt="Pizza">
      </div>
      <div class="item-galeria">
        <img class="img-galeria" src="img/image 4.png" alt="Pizza">
      </div>
      <div class="item-galeria">
        <img class="img-galeria" src="img/image 5.png" alt="Pizza">
      </div>
      <div class="item-galeria">
        <img class="img-galeria" src="img/image 4.png" alt="pizza">
      </div>
    </div>

  </div>
</body>
</html>
